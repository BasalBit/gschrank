[package]
name = "gschrank"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Encrypted environment profiles for your shell"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
zeroize = { version = "1.9", features = ["alloc"] }

[profile.release]
panic = "unwind"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
